<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ruby Password Login Gate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
}

/* ===========================
   Base Canvas & Grids
=========================== */
#matrix {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.circuit-overlay {
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(rgba(255, 0, 0, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 0, 0.08) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(255, 0, 0, 0.1) 2px, transparent 3px);
    background-size: 60px 60px, 60px 60px, 120px 120px;
    background-position: center;
    opacity: 0.5;
    z-index: 1;
    pointer-events: none;
    animation: circuitPulse 6s infinite alternate;
}

@keyframes circuitPulse {
    0% { opacity: 0.3; }
    50% { opacity: 0.7; }
    100% { opacity: 0.3; }
}

.glitch-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.02);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: overlay;
}

.trigger-glitch {
    animation: screenTear 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

@keyframes screenTear {
    0% { opacity: 1; clip-path: inset(10% 0 80% 0); transform: translateX(-10px); }
    20% { opacity: 0.8; clip-path: inset(80% 0 5% 0); transform: translateX(10px); }
    40% { opacity: 1; clip-path: inset(30% 0 40% 0); transform: translateX(-5px); }
    60% { opacity: 0.5; clip-path: inset(60% 0 20% 0); transform: translateX(5px); }
    100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translateX(0); }
}

/* ===========================
   NEW: Cyber Ring Loader
=========================== */
#loader, #decryption-screen {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    transition: 1s;
}

#decryption-screen {
    display: none;
    opacity: 0;
    background: rgba(5, 5, 5, 0.95);
    backdrop-filter: blur(10px);
}

.cyber-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 30px;
}

.cyber-ring::before, .cyber-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    inset: 0;
}

.cyber-ring::before {
    border: 3px solid transparent;
    border-top: 3px solid #ff2020;
    border-right: 3px solid #ff2020;
    animation: spin 1.5s linear infinite;
    box-shadow: 0 0 15px rgba(255, 32, 32, 0.5);
}

.cyber-ring::after {
    border: 3px solid transparent;
    border-bottom: 3px solid #aa0000;
    border-left: 3px solid #aa0000;
    animation: spin 2s linear infinite reverse;
    inset: 10px;
}

.ring-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: 700;
    font-size: 18px;
    color: #ff2020;
    text-shadow: 0 0 10px red;
    animation: pulse 1.2s infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loaderText {
    font-size: 14px;
    letter-spacing: 4px;
    color: #ff6666;
    animation: blink 1s infinite;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

@keyframes blink {
    50% { opacity: .35; }
}

/* ===========================
   Main App UI
=========================== */
#app {
    position: relative;
    display: none;
    width: 100%;
    height: 100%;
    z-index: 5;
}

.bgGlow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: red;
    filter: blur(180px);
    opacity: .12;
    animation: floatGlow 10s ease-in-out infinite;
}
.glow1 { top: -200px; left: -120px; }
.glow2 { bottom: -220px; right: -120px; animation-delay: 5s; }

@keyframes floatGlow {
    0% { transform: translateY(0); }
    50% { transform: translateY(-40px); }
    100% { transform: translateY(0); }
}

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.loginCard {
    position: relative;
    width: 420px;
    padding: 45px;
    border-radius: 24px;
    background: rgba(10, 10, 10, .85);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 0, 0, .35);
    box-shadow: 0 0 25px rgba(255, 0, 0, .25), 0 0 70px rgba(255, 0, 0, .15);
    animation: cardShow .8s ease;
    overflow: hidden;
}

.loginCard::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff0000, transparent);
    animation: scan 3s linear infinite;
}

@keyframes scan { 100% { left: 100%; } }
@keyframes cardShow {
    from { opacity: 0; transform: translateY(40px) scale(.95); }
    to { opacity: 1; transform: none; }
}

.logoCircle {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 700;
    background: #111;
    border: 2px solid red;
    color: #ff2020;
    box-shadow: 0 0 20px red, inset 0 0 20px rgba(255, 0, 0, .35);
}

.loginCard h1 {
    margin-top: 18px;
    font-size: 36px;
    text-align: center;
    letter-spacing: 4px;
}

.subtitle {
    margin-top: 8px;
    text-align: center;
    color: #bbbbbb;
    font-size: 14px;
    margin-bottom: 30px;
}

.inputBox {
    position: relative;
    margin-bottom: 22px;
}

.inputBox input {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: #111;
    border: 1px solid #333;
    color: white;
    outline: none;
    font-size: 15px;
    transition: .3s;
    text-transform: uppercase;
}

.inputBox input:focus {
    border-color: red;
    box-shadow: 0 0 15px rgba(255, 0, 0, .4);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #700000, #ff0000);
    color: white;
    transition: .35s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px red, 0 0 40px rgba(255, 0, 0, .3);
}

#status {
    margin-top: 18px;
    text-align: center;
    font-weight: 600;
    min-height: 25px;
}

.good { color: #00ff88; }
.bad { color: #ff5555; }

#countdown {
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
    color: #ff8080;
}

#continueArea {
    display: none;
    margin-top: 20px;
    animation: cardShow .5s;
}

/* ========= PREMIUM EFFECTS ========= */
.successFlash { animation: successFlash .8s; }
.errorShake { animation: errorShake .45s; }

@keyframes successFlash {
    0% { transform: scale(.95); box-shadow: 0 0 0 red; }
    50% { transform: scale(1.03); box-shadow: 0 0 40px #ff0000, 0 0 80px rgba(255, 0, 0, .45); }
    100% { transform: scale(1); }
}

@keyframes errorShake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
    100% { transform: translateX(0); }
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff0000;
    pointer-events: none;
    animation: particleFloat linear forwards;
    box-shadow: 0 0 12px red;
    z-index: 3;
}

@keyframes particleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-250px) scale(1.5); }
}

.scanline {
    position: fixed;
    left: 0;
    top: -2px;
    width: 100%;
    height: 2px;
    background: red;
    box-shadow: 0 0 20px red;
    animation: scanMove 4s linear infinite;
    opacity: .45;
    pointer-events: none;
    z-index: 4;
}

@keyframes scanMove {
    0% { top: -2px; }
    100% { top: 100%; }
}

.fadeOut { animation: fadeOut .8s forwards; }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

#mouseGlow {
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 0, 0, .18), transparent 70%);
    transform: translate(-50%, -50%);
    z-index: 6;
    filter: blur(25px);
}

.footer {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 2px;
    color: #888;
    opacity: .75;
    z-index: 5;
}

/* Decryption terminal text */
.terminal-line {
    font-family: monospace;
    color: #ff2020;
    font-size: 16px;
    margin-bottom: 8px;
    text-align: left;
    width: 100%;
    max-width: 400px;
}
.terminal-success { color: #00ff88; }
</style>
</head>

<body>

<div id="loader">
    <div class="cyber-ring">
        <div class="ring-center">RUBY</div>
    </div>
    <div class="loaderText">INITIALIZING RUBY PASSWORD GATE...</div>
</div>

<div id="decryption-screen">
    <div class="cyber-ring" style="width: 80px; height: 80px; margin-bottom: 20px;">
        <div class="ring-center" style="font-size: 12px;">RUBY</div>
    </div>
    <div id="terminal-output"></div>
</div>

<canvas id="matrix"></canvas>
<div class="circuit-overlay"></div>
<div class="glitch-overlay" id="glitch-layer"></div>

<div id="app">
    <div class="bgGlow glow1"></div>
    <div class="bgGlow glow2"></div>

    <div class="center">
        <div class="loginCard" id="mainCard">
            <div class="logoCircle">R</div>
            <h1>RUBY</h1>
            <p class="subtitle">Powered By RUBYGameingOP</p>
            
            <div id="inputSection">
                <div class="inputBox">
                    <input type="password" id="keyInput" placeholder="Enter Access Key 🔐">
                    <span></span>
                </div>
                <button id="verifyBtn">Access Link 🔗</button>
            </div>

            <div id="status"></div>
            <div id="countdown"></div>
            
            <div id="continueArea">
                <button id="continueBtn">CONTINUE</button>
            </div>
        </div>
    </div>
</div>

<div id="mouseGlow"></div>
<div class="footer">Status : Secured✅</div>
