<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RUBY Visual Panel</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial;
}

/* Open button */
#openBtn {
  margin: 20px;
  padding: 10px 18px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 15px red;
}

/* Floating panel */
#panel {
  width: 340px;
  height: 450px;
  position: absolute;
  top: 120px;
  left: 120px;
  display: none;
  background: rgba(255,0,0,0.07);
  border: 2px solid red;
  box-shadow: 0 0 30px red;
  backdrop-filter: blur(12px);
  color: white;
}

/* Header */
#header {
  background: red;
  padding: 8px;
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Neon title */
.title {
  font-weight: bold;
  letter-spacing: 2px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px red; }
  to   { text-shadow: 0 0 20px red, 0 0 30px darkred; }
}

/* Buttons */
.btn {
  background: black;
  color: red;
  border: 1px solid red;
  margin: 6px;
  padding: 6px;
  width: 90%;
  box-shadow: 0 0 10px red;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* Slider */
input[type=range] {
  width: 90%;
  margin: 10px;
}

/* Minimized bubble */
#mini {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: red;
  border-radius: 50%;
  box-shadow: 0 0 20px red;
  display: none;
  cursor: pointer;
  text-align: center;
  line-height: 60px;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<button id="openBtn">Open RUBY Menu</button>

<div id="panel">
  <div id="header">
    <span class="title">RUBY VISUAL</span>
    <button onclick="minimize()">_</button>
  </div>

  <div style="padding:10px;">
    <button class="btn">Visual FX</button>
    <button class="btn">Glow Theme</button>
    <button class="btn">Animation Mode</button>

    <p style="color:red;">Circle Slider (UI Only)</p>
    <input type="range" min="0" max="360">

    <p style="color:gray;">Status: Visual Only</p>
  </div>
</div>

<div id="mini" onclick="restore()">R</div>

<script>
let panel = document.getElementById("panel");
let mini = document.getElementById("mini");

document.getElementById("openBtn").onclick = () => {
  panel.style.display = "block";
  document.getElementById("openBtn").style.display = "none";
};

function minimize() {
  panel.style.display = "none";
  mini.style.display = "block";
}

function restore() {
  panel.style.display = "block";
  mini.style.display = "none";
}
</script>

</body>
</html>
