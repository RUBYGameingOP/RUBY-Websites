(function draw(){ctx.fillStyle="rgba(3,0,1,.05)";ctx.fillRect(0,0,w,h);ctx.fillStyle="#f03";ctx.font=fs+"px monospace";
for(let i=0;i<drops.length;i++){ctx.fillText(chars[Math.random()*chars.length|0],i*fs,drops[i]*fs);if(drops[i]*fs>h&&Math.random()>.975)drops[i]=0;drops[i]++;}
for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();

requestAnimationFrame(draw)})();
